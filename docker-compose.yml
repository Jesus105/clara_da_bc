services:
  postgres:
    image: postgres:16-alpine
    container_name: tasknest-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: "${DB_PASSWORD:?Missing DB_PASSWORD - run ./scripts/setup_postgres.sh to create .env}"
      POSTGRES_DB: ${DB_NAME:-tasknest}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql:/sql:ro
      - ./data/raw/trial_users.csv:/data/trial_users.csv:ro
      - ./data/raw/product_events.csv:/data/product_events.csv:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-tasknest}"]
      interval: 3s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
